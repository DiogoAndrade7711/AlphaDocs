services:
  # ── Backend (Web Service) ──────────────────────────────────────────────────
  - type: web
    name: alphadocs-api
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Preencha as variáveis abaixo no painel do Render após o deploy
      # (Render > alphadocs-api > Environment)
      - key: CLIENT_URL
        sync: false          # você cola a URL do frontend depois
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DOCS_API_KEY
        sync: false
      - key: DOCS_API_BASE_URL
        value: https://meudocdigital.com/api/public/v1
      - key: DOCS_API_WEBHOOK_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: AlphaDocs <noreply@alphadocs.com.br>
      - key: PDF_BUCKET
        value: alphadocs-pdfs

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: alphadocs-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
